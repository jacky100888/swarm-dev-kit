description = "啟動 Antigravity Swarm 四階段開發流程（Grok 指揮 → Claude 規格 → Claude+Gemini 開發 → Codex 單一驗收）"
prompt = """
請遵循 swarm-workflow 技能的四階段流程處理以下任務：
任務目標：{{args}}

1. [Stage 1 - Grok 指揮]：盤點受影響模組、判斷風險等級、列出檔案分工。
2. [Stage 2 - Claude 技術規格]：產出或核對 `docs/specs/<feature>.spec.md`（API 契約、DB Schema、檔案分工與行數預算、Acceptance Criteria）。
3. [Stage 3 - Claude + Gemini 開發]：核心與高風險由 Claude；frontend、低風險後端、測試、文件由 Gemini；不改同一檔案，合併後跑測試，輸出 `docs/specs/<feature>.impl.md`。
4. [Stage 4 - Codex 驗收]：單一關審查契約、防禦規則與邊界反例；僅權限、金流、migration、併發加紅隊；輸出 `docs/specs/<feature>.verify.md`。退件只複驗未通過項目。
"""
